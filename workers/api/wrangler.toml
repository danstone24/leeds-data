name = "leeds-data-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Route the Worker at /api/* on the Pages domain.
# Configured in the Cloudflare dashboard:
#   Workers & Pages → leeds-data-api → Settings → Domains & Routes
# (Not declared here because Workers Builds doesn't yet apply route changes
#  from wrangler.toml; the dashboard is the source of truth for the route.)

# Workers KV namespace for precomputed dataset summaries.
# Writes happen from the refresh script (.github/workflows/refresh-data.yml),
# reads happen from this Worker.
[[kv_namespaces]]
binding = "CACHE"
id = "300899a1aa20400e988b897f8d111674"

[observability]
enabled = true
